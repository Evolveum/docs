{%- if page.midpointBranch != null %}
  {%- assign source_path = page.path | replace: "midpoint/reference/", "" | replace: page.midpointBranchSlug, "" %}
  <li><a href="https://github.com/Evolveum/midpoint/blob/{{ page.midpointBranch }}/docs{{ source_path }}"><i class="fa-brands fa-github fa-fw" aria-hidden="true"></i>Edit on GitHub</a></li>
  <li><a href="https://github.com/Evolveum/midpoint/commits/{{ page.midpointBranch }}/docs{{ source_path }}"><i class="fa-solid fa-clock-rotate-left fa-fw" aria-hidden="true"></i>History</a></li>
{%- else %}
  <li><a href="https://github.com/Evolveum/docs/blob/master/{{ page.path }}"><i class="fa-brands fa-github fa-fw" aria-hidden="true"></i>Edit on GitHub</a></li>
  <li><a href="https://github.com/Evolveum/docs/commits/master/{{ page.path }}"><i class="fa-solid fa-clock-rotate-left fa-fw" aria-hidden="true"></i>History</a></li>
{%- endif %}
