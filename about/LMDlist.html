<!DOCTYPE html>
<link rel="stylesheet" href="/assets/css/daterangepicker.css">
<link rel="stylesheet" href="/assets/css/LMDLpage.css">
<span class="LMDLfilters"><span class="LMDLtypefilters"><select id="selectpickerversion" multiple="" data-actionsBox="true" title="Select version" data-style="btn-light btn-sm" data-width="9em">
</select>
<select id="selectpickercategory" multiple="" data-actionsBox="true" title="Select category" data-style="btn-light btn-sm" data-width="9em">
    <option class="LMDLcategoryGuide">Guide</option>
    <option class="LMDLcategoryBook">Book</option>
    <option class="LMDLcategoryReference">Reference</option>
    <option class="LMDLcategoryDeveloper">Developer</option>
    <option class="LMDLcategoryOther">Other</option>
</select>
<select id="selectpickerimpact" multiple="" data-actionsBox="true" data-title="Select impact of change" data-style="btn-light btn-sm" data-width="12em">
    <option class="LMDLimpactCreated">Created</option>
    <option class="LMDLimpactRemoved">Removed</option>
    <option class="LMDLimpactMajor">Major</option>
    <option class="LMDLimpactSignificant">Significant</option>
    <option class="LMDLimpactMinor">Minor</option>
</select>
<select id="selectpickerauthor" data-live-search="true" data-actionsBox="true" multiple="" title="Select authors" data-style="btn-light btn-sm" data-width="8.5em">
</select>
<div><button class="LMDLDatePickerButton btn-light btn btn-sm"><i class="far fa-calendar-alt LMDLDatePickerIcon"></i>&nbsp;<span id="LMDLPickedDate">Pick a date range</span></button>
</div>
</span>
<span class="LMDLfiltersearch"><form class="form-inline mt-2 mt-md-0 LMDLsearchform" onsubmit="return false;" method="post" id="search-ddg">
    <input class="form-control form-control-sm mr-sm-2" id="LMDLsearchbar" type="text" placeholder="Search" name="q" aria-label="Search" style="width: 16em;">
    <button id="LMDLsearchButton" class="btn btnLMDLsearch btn-sm my-2 my-sm-0" type="submit">Search</button></form>
<select id="selectpickersearchin" multiple="" data-actionsBox="true" title="Select where to search" data-style="btn-light btn-sm" data-width="11.5em">
    <option>Title</option>
    <option>Text</option>
    <option>Commit message</option>
</select></span>
<div class="notShown" id="LMDLmoreFiltersButton">More filters&nbsp;<i class="fas fa-caret-down" style="color: #555753;"></i></div>
</span>
<table class="table LMDtable" style="table-layout: fixed;">
    <thead>
        <tr>
            <th scope="col" id="LMDLtitleHeader" class="tableCentered" style="width: 15%;">Page title</th>
            <th scope="col" id="LMDLversionHeader" class="tableCentered" style="width: 11%;">Version</th>
            <th scope="col" id="LMDLcategoryHeader" class="tableCentered" style="width: 10%;">Category</th>
            <th scope="col" id="LMDLimpactHeader" class="tableCentered LMDLtooltipTh" style="width: 11%" data-toggle="tooltip" data-html="true" title='<div><span>Extend to which the page had been modified</span><br><span><span class="LMDLimpactMajor">Major</span>
                - more than 30% of lines were edited</span><br><span><span class="LMDLimpactSignificant">Significant</span> - more than 10% and less than 30% of lines were edited</span><br><span><span class="LMDLimpactMinor">Minor</span> - less than 10% of lines were edited</span></div>'>Impact of change&nbsp;<i style="font-size: 0.8rem;" class="fas fa-question-circle"></i></th>
            <th scope="col" id="LMDLauthorHeader" class="tableCentered" style="width: 11%">Author</th>
            <th scope="col" id="LMDLdateHeader" class="LMDLlmd tableCentered" style="width: 11%;">Last modification date</th>
            <th scope="col" id="LMDLmessageHeader" class="LMDLpreview tableCentered" style="width: 20%;">Commit message</th>
        </tr>
    </thead>
    <tbody id="listOfUpdatedPages">

    </tbody>
</table>
<script defer src="/assets/js/moment.min.js"></script>
<script defer src="/assets/js/daterangepicker.min.js"></script>
<script defer src="/assets/js/LMDLpage.js"></script>
